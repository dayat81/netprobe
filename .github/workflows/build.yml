name: Magnon Lite release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  lite-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAGNON_HMAC_KEY_ID: ${{ secrets.MAGNON_HMAC_KEY_ID }}
          MAGNON_HMAC_KEY_HEX: ${{ secrets.MAGNON_HMAC_KEY_HEX }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "missing KEY_PASSWORD"; exit 1; }
          test -n "$MAGNON_HMAC_KEY_ID" || { echo "missing MAGNON_HMAC_KEY_ID"; exit 1; }
          test -n "$MAGNON_HMAC_KEY_HEX" || { echo "missing MAGNON_HMAC_KEY_HEX"; exit 1; }
          echo "release secrets present"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magnon-release.jks"
          test -s "$RUNNER_TEMP/magnon-release.jks"

      - name: Build release APKs
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/magnon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAGNON_COLLECTOR_HOST: magnon.site
          MAGNON_COLLECTOR_PORT: "443"
          MAGNON_HMAC_KEY_ID: ${{ secrets.MAGNON_HMAC_KEY_ID }}
          MAGNON_HMAC_KEY_HEX: ${{ secrets.MAGNON_HMAC_KEY_HEX }}
          MAGNON_MEASURE_KEY_HEX: ${{ secrets.MAGNON_MEASURE_KEY_HEX }}
          MAGNON_GOOGLE_CLIENT_ID: ${{ secrets.MAGNON_GOOGLE_CLIENT_ID }}
        run: chmod +x gradlew && ./gradlew :app:assembleLiteRelease :app:assemblePremiumRelease --no-daemon

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: magnon-lite-release
          path: android/app/build/outputs/apk/lite/release/magnon-lite-*.apk

      - name: Upload Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: magnon-premium-release
          path: android/app/build/outputs/apk/premium/release/magnon-premium-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Magnon ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: |
            android/app/build/outputs/apk/lite/release/magnon-lite-*.apk
            android/app/build/outputs/apk/premium/release/magnon-premium-*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
