# MySignal debug APK on azvm nginx :8080.
#   http://PUBLIC_IP:8080/mysignal.apk

location = /mysignal.apk {
    alias /var/www/mysignal/mysignal.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Type application/vnd.android.package-archive always;
    add_header Content-Disposition 'attachment; filename="mysignal.apk"' always;
    add_header Cache-Control "no-store" always;
    sendfile on;
}
