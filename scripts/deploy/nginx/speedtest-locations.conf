# OoklaServer-like HTTP speedtest for MySignal (azvm :8080 peta-degradasi).
# URLs:
#   http://PUBLIC_IP:8080/speedtest/hello
#   http://PUBLIC_IP:8080/speedtest/download?size=N
#   http://PUBLIC_IP:8080/speedtest/upload

location = /speedtest {
    return 302 /speedtest/hello;
}

location = /speedtest/ {
    return 302 /speedtest/hello;
}

location ^~ /speedtest/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 128m;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-store" always;
}
