# Short test videos for the MySignal video tab (azvm :8080 peta-degradasi).
#   http://PUBLIC_IP:8080/video/360.mp4
#   http://PUBLIC_IP:8080/video/720.mp4
#   http://PUBLIC_IP:8080/video/1080.mp4

location ^~ /video/ {
    alias /var/www/video/;
    types {
        video/mp4 mp4;
    }
    default_type video/mp4;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin * always;
    sendfile on;
}
