# Public HTTPS for netprobe.xyz. The application locations are the same
# snippets already included by the :8080 site. /v1/ reaches the collector.

server {
    listen 80;
    server_name netprobe.xyz www.netprobe.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://netprobe.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name netprobe.xyz www.netprobe.xyz;

    ssl_certificate /etc/letsencrypt/live/netprobe.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netprobe.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/mysignal-apk-locations.conf;
    include snippets/video-locations.conf;
    include snippets/crowd-dashboard.conf;
    include snippets/speedtest-locations.conf;
    include snippets/ookla-apk-locations.conf;
    include snippets/opensignal-apk-locations.conf;
    include snippets/measure-dashboard.conf;
    include snippets/nr-audit-locations.conf;
    include snippets/geohash-locations.conf;
    include snippets/radio-live.conf;

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    root /data/opensignal/exports_sulmapap;
    index peta_degradasi_lengkap.html;

    location /visit/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    return 301 https://netprobe.xyz$request_uri;
}
